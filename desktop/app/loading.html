<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Studyisfunny</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif; background: #F4F5FC; color: #181527;
    display: flex; align-items: center; justify-content: center;
  }
  .box { text-align: center; max-width: 560px; padding: 24px; }
  .logo { width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 22px; background: #4338CA; display: flex; align-items: center; justify-content: center; }
  .spinner { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 22px; margin: 0 0 10px; }
  #message { color: #6B7280; font-size: 15px; line-height: 1.8; min-height: 27px; }
  #message.error { color: #B91C1C; font-weight: 600; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><div class="spinner" id="spinner"></div></div>
    <h1>Studyisfunny</h1>
    <div id="message">بيجهز البرنامج...</div>
  </div>
<script>
  window.desktop.onLoadingMessage(({ message, isError }) => {
    const el = document.getElementById('message');
    el.textContent = message;
    el.className = isError ? 'error' : '';
  });
</script>
</body>
</html>
