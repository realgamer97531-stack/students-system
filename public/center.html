<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>بوابة السنتر | Studyisfunny</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Cairo,sans-serif;min-height:100vh;background:#f4f5fc;color:#181527}.top{background:linear-gradient(135deg,#312e81,#4338ca);color:#fff}.card{border:0;border-radius:14px;box-shadow:0 8px 24px rgba(30,27,75,.08)}.metric strong{font-size:1.8rem;color:#4338ca}.btn-primary{background:#4338ca;border-color:#4338ca}#dashboard{display:none}</style></head><body><header class="top py-4"><div class="container d-flex justify-content-between align-items-center"><div><div class="fw-bold fs-5">Studyisfunny</div><div id="centerName" class="small opacity-75">بوابة السنتر</div></div><button id="logout" class="btn btn-outline-light btn-sm" style="display:none">خروج</button></div></header><main class="container py-5"><section id="login" class="card mx-auto p-4 p-md-5" style="max-width:430px"><div class="text-center mb-4"><h1 class="h3 fw-bold">دخول السنتر</h1><p class="text-muted">تابع الأكواد والأرصدة الخاصة بسنترك.</p></div><div id="message"></div><form id="loginForm"><label class="form-label fw-semibold">اسم المستخدم</label><input name="username" class="form-control mb-3" required><label class="form-label fw-semibold">كلمة المرور</label><input name="password" type="password" class="form-control" required><button class="btn btn-primary w-100 mt-4 fw-bold">دخول</button></form><a href="register.html" class="d-block text-center text-muted small mt-3">تسجيل طالب</a></section><section id="dashboard"><h1 class="h3 fw-bold mb-4">ملخص الأكواد والأرصدة</h1><div id="metrics" class="row g-3"></div><p class="text-muted mt-4 small">قيمة الأكواد المستخدمة هي القيمة المسجلة للسنتر بعد بيعها للطلاب.</p></section></main><script src="config.js"></script><script>
const tokenKey='center_portal_token', login=document.getElementById('login'), dashboard=document.getElementById('dashboard'), message=document.getElementById('message'), logout=document.getElementById('logout');
function error(text){message.innerHTML='<div class="alert alert-danger">'+text+'</div>'}function esc(text){const d=document.createElement('div');d.textContent=text;return d.innerHTML}
async function loadDashboard(){const token=localStorage.getItem(tokenKey);if(!token)return;const response=await fetch(`${API_BASE_URL}/api/public/center-dashboard`,{headers:{Authorization:`Bearer ${token}`}});const data=await response.json();if(!response.ok||!data.success){localStorage.removeItem(tokenKey);return}document.getElementById('centerName').textContent=data.centerName;const s=data.stats;const metrics=[['الأكواد المستلمة',s.receivedCount],['الأكواد المستخدمة',s.usedCount],['الأكواد المتاحة',s.availableCount],['قيمة الأكواد المستخدمة',s.usedAmount+' ج'],['الرصيد المتاح',s.availableAmount+' ج'],['إجمالي قيمة الأكواد',s.receivedAmount+' ج']];document.getElementById('metrics').innerHTML=metrics.map(item=>`<div class="col-md-4"><div class="metric card bg-white p-4 h-100"><div class="text-muted small">${esc(item[0])}</div><strong>${esc(item[1])}</strong></div></div>`).join('');login.style.display='none';dashboard.style.display='block';logout.style.display='block'}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();message.innerHTML='';const body=Object.fromEntries(new FormData(e.target));try{const response=await fetch(`${API_BASE_URL}/api/public/center-login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message);localStorage.setItem(tokenKey,data.token);await loadDashboard()}catch(err){error(err.message||'تعذر تسجيل الدخول.')}});logout.addEventListener('click',()=>{localStorage.removeItem(tokenKey);window.location.reload()});loadDashboard();
</script></body></html>
