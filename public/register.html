<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل طالب جديد | Shady Elsharkawy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--sf-bg:#f7f8fd;--sf-card:#fff;--sf-text:#1e293b;--sf-muted:#64748b;--sf-border:#e2e8f0;--sf-primary:#4f46e5;--sf-accent:#10b3a3;--sf-primary-dark:#3730a3}*{font-family:Cairo,sans-serif;box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--sf-bg);color:var(--sf-text);transition:background-color .3s ease,color .3s ease}.login-wrapper{min-height:100vh;display:flex;align-items:center;position:relative;overflow:hidden;padding:64px 0 32px}.content-container{z-index:1;position:relative;width:100%}.bg-shape{position:absolute;border-radius:50%;filter:blur(90px);z-index:0;opacity:.25;animation:float 7s ease-in-out infinite}.bg-shape-1{width:350px;height:350px;background:var(--sf-primary);top:-60px;right:-60px}.bg-shape-2{width:450px;height:450px;background:var(--sf-accent);bottom:-120px;left:-120px;animation-delay:2.5s}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(25px)}}.theme-controls{position:fixed;top:20px;left:20px;z-index:1050;display:flex;gap:10px}.control-btn{background:rgba(255,255,255,.9);border:1px solid var(--sf-border);padding:8px 14px;border-radius:30px;cursor:pointer;font-weight:600;font-size:.85rem;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:all .3s ease;color:var(--sf-text)}.logo-mark{width:50px;height:50px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--sf-accent),var(--sf-primary));color:#fff;font-size:1.55rem;font-weight:800;border-radius:13px;box-shadow:0 10px 20px rgba(67,56,202,.2)}.card{background:var(--sf-card);border:1px solid var(--sf-border);border-radius:18px;box-shadow:0 20px 48px rgba(30,41,59,.12);color:var(--sf-text)}.form-control,.form-select{background:var(--sf-bg);border-color:var(--sf-border);color:var(--sf-text);padding:.62rem .8rem;font-size:.94rem}.form-control:focus,.form-select:focus{border-color:var(--sf-primary);box-shadow:0 0 0 .25rem rgba(79,70,229,.15)}.btn-primary{background:var(--sf-primary);border-color:var(--sf-primary)}.btn-success{background:var(--sf-accent);border-color:var(--sf-accent)}.code-box{border:2px solid var(--sf-accent);background:#effcf9}.hint{color:var(--sf-muted);font-size:.84rem}.result-code{font-size:1.4rem;letter-spacing:1px;color:var(--sf-primary)}#loading{display:none}.fade-in-up{animation:fadeInUp .7s cubic-bezier(.2,.8,.2,1) forwards;opacity:0}@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}body.dark-theme{--sf-bg:#0b0f19;--sf-card:#141b2d;--sf-text:#f1f5f9;--sf-muted:#94a3b8;--sf-border:#1f293d;--sf-primary:#6366f1}body.dark-theme .control-btn{background:var(--sf-card);color:var(--sf-text)}body.dark-theme .code-box{background:rgba(16,179,163,.12)}
  </style>
</head>
<body><div class="theme-controls"><button class="control-btn" id="theme-toggle-btn" onclick="toggleTheme()">🌙</button></div><main class="login-wrapper"><div class="bg-shape bg-shape-1"></div><div class="bg-shape bg-shape-2"></div><div class="container content-container fade-in-up"><div class="row justify-content-center"><div class="col-sm-10 col-md-8 col-lg-6 col-xl-5"><div class="text-center mb-3"><div class="logo-mark mx-auto mb-2">S</div><div class="brand fs-5 fw-bold">Shady Elsharkawy</div><h1 class="h3 fw-bold mt-2 mb-1">تسجيل طالب جديد</h1><p class="hint mb-0">استخدم كود الشحن الذي استلمته من السنتر لإكمال التسجيل.</p></div>
  <div class="card p-3 p-md-4">
    <div id="message"></div><div id="loading" class="alert alert-info">جاري التسجيل...</div>
    <form id="registrationForm"><div class="row g-3">
      <div class="col-md-6"><label class="form-label fw-semibold">اسم الطالب</label><input name="name" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label fw-semibold">تليفون الطالب</label><input name="phone" class="form-control" inputmode="numeric" required></div>
      <div class="col-md-6"><label class="form-label fw-semibold">تليفون ولي الأمر</label><input name="parent_phone" class="form-control" inputmode="numeric" required></div>
      <div class="col-md-6"><label class="form-label fw-semibold">السنتر الذي سيحضر فيه الطالب</label><select name="center_id" id="center" class="form-select" required><option value="">جاري تحميل السناتر...</option></select></div>
      <div class="col-md-6"><label class="form-label fw-semibold">المادة</label><select name="subject_id" id="subject" class="form-select" required><option value="">جاري تحميل المواد...</option></select></div>
      <div class="col-md-6"><label class="form-label fw-semibold">سعر الحصة (ج)</label><input id="sessionPrice" type="number" class="form-control" readonly aria-readonly="true"><div class="hint mt-2">يتم تحديد السعر تلقائيًا حسب الصف الدراسي.</div></div>
      <div class="col-12"><label class="form-label fw-semibold">كود الشحن</label><input name="recharge_code" class="form-control code-box text-uppercase" maxlength="20" required><div class="hint mt-2">سيتم إضافة قيمة الكود إلى رصيد الطالب بعد قبول التسجيل.</div></div>
    </div><button id="submit" class="btn btn-primary w-100 mt-4 py-2 fw-bold">تأكيد التسجيل</button></form>
  </div></div></div></div></main><script src="config.js"></script><script>
const form=document.getElementById('registrationForm'), message=document.getElementById('message'), loading=document.getElementById('loading');
function showError(text){message.innerHTML='<div class="alert alert-danger">'+text+'</div>'} function escapeHtml(text){const div=document.createElement('div');div.textContent=text;return div.innerHTML}
async function loadRegistrationOptions(){try{const response=await fetch(`${API_BASE_URL}/api/public/student-registration-options`);const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message);document.getElementById('subject').innerHTML='<option value="">اختر المادة</option>'+data.subjects.map(s=>`<option value="${s.id}" data-price="${s.sessionPrice}">${escapeHtml(s.name)}</option>`).join('');document.getElementById('center').innerHTML='<option value="">اختر السنتر</option>'+data.centers.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');document.getElementById('subject').addEventListener('change',event=>{document.getElementById('sessionPrice').value=event.target.selectedOptions[0]?.dataset.price||''})}catch(error){showError(error.message||'تعذر تحميل السناتر والمواد.')}}
async function openStudentPage(phone,studentCode){const response=await fetch(`${API_BASE_URL}/api/portal/student-login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:String(phone).replace(/[^0-9]/g,''),student_code:studentCode})});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message||'تعذر فتح صفحة الطالب.');localStorage.setItem('portal_token',data.token);localStorage.setItem('portal_type','student');localStorage.setItem('student_code',studentCode);window.location.href='student.html'}
form.addEventListener('submit',async event=>{event.preventDefault();message.innerHTML='';loading.style.display='block';document.getElementById('submit').disabled=true;const body=Object.fromEntries(new FormData(form));body.price_per_session=document.getElementById('sessionPrice').value;try{const response=await fetch(`${API_BASE_URL}/api/public/student-register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message);document.querySelector('.card').innerHTML=`<div class="text-center"><div id="resultMessage"></div><div class="text-success fs-1">✓</div><h2 class="h3 fw-bold">تم التسجيل بنجاح</h2><p class="text-muted">أهلاً ${escapeHtml(data.student.name)}، احتفظ بالبيانات التالية.</p><div class="border rounded-3 p-3 mb-3"><div class="small text-muted">كود الطالب</div><div class="result-code fw-bold">${escapeHtml(data.student.student_code)}</div><div class="small text-muted mt-2">سنتر الحضور</div><div class="fw-semibold">${escapeHtml(data.attendanceCenterName||'تم التسجيل')}</div></div><img src="${data.qrCodeImage}" alt="QR Code" class="img-fluid" style="max-width:250px"><p class="small fw-semibold mt-3">من فضلك خذ لقطة شاشة لهذا الكود وكود الطالب، لأنك ستحتاج إليهما في كل مرة تفتح فيها المنصة.</p><button id="openStudent" class="btn btn-primary w-100 mt-2">دخول صفحة الطالب</button></div>`;document.getElementById('openStudent').addEventListener('click',async()=>{document.getElementById('openStudent').disabled=true;document.getElementById('openStudent').textContent='جاري فتح صفحة الطالب...';try{await openStudentPage(body.phone,data.student.student_code)}catch(error){document.getElementById('resultMessage').innerHTML=`<div class="alert alert-danger mt-3">${escapeHtml(error.message)}</div>`;document.getElementById('openStudent').disabled=false;document.getElementById('openStudent').textContent='دخول صفحة الطالب'}})}catch(error){showError(error.message||'حصلت مشكلة أثناء التسجيل.');document.getElementById('submit').disabled=false}finally{loading.style.display='none'}});function toggleTheme(){const theme=localStorage.getItem('portal_theme')||'light';const nextTheme=theme==='light'?'dark':'light';localStorage.setItem('portal_theme',nextTheme);document.body.classList.toggle('dark-theme',nextTheme==='dark');document.getElementById('theme-toggle-btn').textContent=nextTheme==='dark'?'☀️':'🌙'}document.body.classList.toggle('dark-theme',localStorage.getItem('portal_theme')==='dark');if(localStorage.getItem('portal_theme')==='dark')document.getElementById('theme-toggle-btn').textContent='☀️';loadRegistrationOptions();
</script></body></html>
