<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل طالب جديد | Studyisfunny</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#4338ca;--accent:#14b8a6;--ink:#181527;--muted:#6b7280}*{font-family:Cairo,sans-serif;box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef0fb,#f8fafc 52%,#dff7f3);color:var(--ink)}.shell{max-width:900px;margin:auto;padding:42px 18px}.brand{color:var(--primary);font-weight:800}.card{border:0;border-radius:16px;box-shadow:0 20px 48px rgba(30,27,75,.12)}.form-control,.form-select{border-color:#e2e4f3;padding:.72rem .9rem}.btn-primary{background:var(--primary);border-color:var(--primary)}.code-box{border:2px solid var(--accent);background:#effcf9}.hint{color:var(--muted);font-size:.88rem}.result-code{font-size:1.4rem;letter-spacing:1px;color:var(--primary)}#loading{display:none}
  </style>
</head>
<body><main class="shell"><div class="text-center mb-4"><div class="brand fs-4">Studyisfunny</div><h1 class="fw-bold mt-2">تسجيل طالب جديد</h1><p class="hint">استخدم كود الشحن الذي استلمته من السنتر لإكمال التسجيل.</p></div>
  <div class="card p-4 p-md-5">
    <div id="message"></div><div id="loading" class="alert alert-info">جاري التسجيل...</div>
    <form id="registrationForm"><div class="row g-3">
      <div class="col-md-6"><label class="form-label fw-semibold">اسم الطالب</label><input name="name" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label fw-semibold">تليفون الطالب</label><input name="phone" class="form-control" inputmode="numeric" required></div>
      <div class="col-md-6"><label class="form-label fw-semibold">تليفون ولي الأمر</label><input name="parent_phone" class="form-control" inputmode="numeric" required></div>
      <div class="col-md-6"><label class="form-label fw-semibold">السنتر</label><select name="center_id" id="center" class="form-select" required><option value="">جاري تحميل السناتر...</option></select></div>
      <div class="col-md-6"><label class="form-label fw-semibold">المادة</label><select name="subject_id" id="subject" class="form-select" required><option value="">جاري تحميل المواد...</option></select></div>
      <div class="col-md-6"><label class="form-label fw-semibold">سعر الحصة (ج)</label><input name="price_per_session" type="number" min="0" step="0.01" class="form-control" required></div>
      <div class="col-12"><label class="form-label fw-semibold">كود الشحن</label><input name="recharge_code" class="form-control code-box text-uppercase" maxlength="20" required><div class="hint mt-2">سيتم إضافة قيمة الكود إلى رصيد الطالب بعد قبول التسجيل.</div></div>
    </div><button id="submit" class="btn btn-primary w-100 mt-4 py-2 fw-bold">تأكيد التسجيل</button></form>
    <div class="text-center mt-3"><a href="center.html" class="hint">دخول السنتر</a></div>
  </div>
</main><script src="config.js"></script><script>
const form=document.getElementById('registrationForm'), message=document.getElementById('message'), loading=document.getElementById('loading');
function showError(text){message.innerHTML='<div class="alert alert-danger">'+text+'</div>'} function escapeHtml(text){const div=document.createElement('div');div.textContent=text;return div.innerHTML}
async function loadRegistrationOptions(){try{const response=await fetch(`${API_BASE_URL}/api/public/student-registration-options`);const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message);document.getElementById('subject').innerHTML='<option value="">اختر المادة</option>'+data.subjects.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');document.getElementById('center').innerHTML='<option value="">اختر السنتر</option>'+data.centers.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}catch(error){showError(error.message||'تعذر تحميل السناتر والمواد.')}}
form.addEventListener('submit',async event=>{event.preventDefault();message.innerHTML='';loading.style.display='block';document.getElementById('submit').disabled=true;const body=Object.fromEntries(new FormData(form));try{const response=await fetch(`${API_BASE_URL}/api/public/student-register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message);document.querySelector('.card').innerHTML=`<div class="text-center"><div class="text-success fs-1">✓</div><h2 class="h3 fw-bold">تم التسجيل بنجاح</h2><p class="text-muted">أهلاً ${escapeHtml(data.student.name)}، احتفظ بالبيانات التالية.</p><div class="border rounded-3 p-3 mb-3"><div class="small text-muted">كود الطالب</div><div class="result-code fw-bold">${escapeHtml(data.student.student_code)}</div><div class="small text-muted mt-2">السنتر</div><div class="fw-semibold">${escapeHtml(data.centerName||'تم التسجيل')}</div></div><img src="${data.qrCodeImage}" alt="QR Code" class="img-fluid" style="max-width:250px"><p class="small text-muted mt-3">يمكنك أخذ لقطة شاشة لهذه الصفحة.</p><a href="register.html" class="btn btn-primary w-100">تسجيل طالب آخر</a></div>`}catch(error){showError(error.message||'حصلت مشكلة أثناء التسجيل.');document.getElementById('submit').disabled=false}finally{loading.style.display='none'}});loadRegistrationOptions();
</script></body></html>
