<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">مشاهدة الدرس</title>
  <link id="bootstrap-link" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    :root {
      --dark-bg: #0b0f19;
      --dark-card: #141b2d;
      --dark-text: #f1f5f9;
      --dark-muted: #94a3b8;
      --dark-border: #1f293d;
      --dark-accent: #6366f1;
    }
    body.dark-theme { background-color: var(--dark-bg) !important; color: var(--dark-text); }
    body.dark-theme .card { background-color: var(--dark-card); border-color: var(--dark-border); color: var(--dark-text); }
    body.dark-theme .text-muted { color: var(--dark-muted) !important; }
    .theme-controls { position: fixed; bottom: 20px; left: 20px; z-index: 1050; display: flex; gap: 10px; }
    html[dir="ltr"] .theme-controls { left: auto; right: 20px; }
    .control-btn { background: rgba(255,255,255,0.9); border: 1px solid #E2E4F3; padding: 8px 14px; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    body.dark-theme .control-btn { background: var(--dark-card); border-color: var(--dark-border); color: var(--dark-text); }
    .player-frame { width: 100%; max-width: 100%; overflow: hidden; }
    .player-frame iframe, .player-frame video, .player-frame > div { display: block; width: 100%; max-width: 100%; }
    @media (max-width: 576px) {
      .container { padding-left: 12px; padding-right: 12px; }
      .card-body { padding: 12px; }
      .navbar-brand { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .navbar-brand .platform-name { display: none; }
      .player-frame { aspect-ratio: 16 / 9; }
      .player-frame iframe, .player-frame video, .player-frame > div { height: 100% !important; }
      .d-flex.justify-content-between { gap: 8px; }
      .d-flex.justify-content-between .btn { flex: 1 1 0; white-space: nowrap; }
      .d-flex.justify-content-between #partIndicator { flex: 0 0 auto; }
    }

    /* ===== Modern senior-student theme (visual only) ===== */
    :root {
      --lv-bg: #f4f5fb;
      --lv-surface: #ffffff;
      --lv-text: #0f172a;
      --lv-muted: #64748b;
      --lv-border: #e3e6f3;
      --lv-accent: #6366f1;
      --lv-accent-2: #8b5cf6;
      --lv-glow: rgba(99, 102, 241, 0.35);
      --lv-radius: 18px;
    }
    body.dark-theme {
      --lv-bg: #070a14;
      --lv-surface: #10162a;
      --lv-text: #f1f5f9;
      --lv-muted: #94a3b8;
      --lv-border: #1f293d;
      --lv-glow: rgba(129, 140, 248, 0.3);
    }
    body {
      font-family: "Segoe UI", "Cairo", Tahoma, system-ui, -apple-system, sans-serif;
      background-color: var(--lv-bg) !important;
      background-image:
        radial-gradient(900px 420px at 85% -10%, rgba(99, 102, 241, 0.16), transparent 60%),
        radial-gradient(700px 380px at 0% 0%, rgba(139, 92, 246, 0.12), transparent 60%);
      background-repeat: no-repeat;
      color: var(--lv-text);
      min-height: 100vh;
      transition: background-color .3s ease, color .3s ease;
    }

    /* Navbar */
    .navbar {
      position: sticky; top: 0; z-index: 1030;
      padding: 12px 20px !important;
      background: rgba(15, 23, 42, 0.78) !important;
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 6px 24px rgba(2, 6, 23, 0.18);
    }
    body.dark-theme .navbar { background: rgba(7, 10, 20, 0.8) !important; }
    .navbar-brand { font-weight: 700; font-size: 1.05rem; letter-spacing: .2px; margin: 0; }
    .navbar-brand .badge {
      background: linear-gradient(135deg, var(--lv-accent), var(--lv-accent-2)) !important;
      border-radius: 10px; padding: 6px 9px; box-shadow: 0 4px 14px var(--lv-glow);
    }
    .navbar .btn-outline-light {
      border-radius: 999px; padding: 6px 16px; font-weight: 600;
      border-color: rgba(255, 255, 255, 0.25); backdrop-filter: blur(6px);
      transition: all .2s ease;
    }
    .navbar .btn-outline-light:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.5); color: #fff; transform: translateY(-1px); }

    /* Layout */
    .container { max-width: 1080px; }

    /* Category tabs -> segmented pill control */
    .btn-group.w-100 {
      background: var(--lv-surface);
      border: 1px solid var(--lv-border);
      border-radius: 16px;
      padding: 6px;
      gap: 6px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    .btn-group.w-100 > .btn,
    .btn-group.w-100 > .btn:not(:last-child),
    .btn-group.w-100 > .btn:not(:first-child),
    .btn-group.w-100 > .btn-group:not(:last-child) > .btn {
      flex: 1 1 0;
      border: 0 !important;
      border-radius: 12px !important;
      margin: 0 !important;
      padding: 11px 14px;
      font-weight: 700;
      font-size: .95rem;
      color: var(--lv-muted);
      background: transparent;
      transition: all .25s ease;
    }
    .btn-group.w-100 > .btn:hover { color: var(--lv-text); background: rgba(99, 102, 241, 0.09); }
    .btn-group.w-100 > .btn.active,
    .btn-group.w-100 > .btn:active {
      color: #fff !important;
      background: linear-gradient(135deg, var(--lv-accent), var(--lv-accent-2)) !important;
      box-shadow: 0 8px 20px var(--lv-glow);
    }

    /* Player card */
    .card {
      background: var(--lv-surface);
      border: 1px solid var(--lv-border);
      border-radius: var(--lv-radius);
      box-shadow: 0 20px 50px -20px rgba(15, 23, 42, 0.25) !important;
      overflow: hidden;
    }
    body.dark-theme .card { background: var(--lv-surface); border-color: var(--lv-border); box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.7) !important; }
    .card-body { padding: 20px; }
    .player-frame {
      border-radius: 14px;
      background: #000;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 18px 40px -12px rgba(0, 0, 0, 0.55);
    }
    .player-frame iframe, .player-frame video { border-radius: 14px; }

    /* Part navigation */
    .card-body .btn-outline-secondary {
      border-radius: 999px; padding: 9px 20px; font-weight: 600;
      color: var(--lv-text); background: transparent;
      border: 1px solid var(--lv-border);
      transition: all .2s ease;
    }
    .card-body .btn-outline-secondary:hover {
      color: #fff; border-color: transparent;
      background: linear-gradient(135deg, var(--lv-accent), var(--lv-accent-2));
      box-shadow: 0 8px 18px var(--lv-glow); transform: translateY(-1px);
    }
    #partIndicator {
      font-weight: 700; font-size: .9rem; color: var(--lv-muted) !important;
      background: rgba(99, 102, 241, 0.1); padding: 6px 14px; border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }
    #partIndicator:empty { display: none; }
    .text-muted { color: var(--lv-muted) !important; }

    /* Empty-state alert */
    .alert-secondary {
      background: var(--lv-surface); color: var(--lv-muted);
      border: 1px dashed var(--lv-border); border-radius: var(--lv-radius);
      text-align: center; padding: 28px 16px; font-weight: 600;
    }

    /* Floating controls */
    .control-btn {
      background: rgba(255, 255, 255, 0.8); color: var(--lv-text);
      border: 1px solid var(--lv-border);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.15);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .control-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 26px var(--lv-glow); }
    body.dark-theme .control-btn { background: rgba(16, 22, 42, 0.85); }

    @media (max-width: 576px) {
      .navbar { padding: 10px 12px !important; }
      .card-body { padding: 12px; }
      .btn-group.w-100 > .btn { padding: 10px 6px; font-size: .85rem; }
      .card { border-radius: 14px; }
    }
  </style>
</head>
<body class="bg-light">
  <div class="theme-controls">
    <button class="control-btn" id="lang-toggle-btn" onclick="toggleLanguage()">English</button>
    <button class="control-btn" id="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
  </div>

  <nav class="navbar navbar-dark bg-dark px-3">
    <a href="lessons.html" class="btn btn-sm btn-outline-light" id="btn-back">⬅ رجوع للدروس</a>
    <span class="navbar-brand d-flex align-items-center gap-2"><span class="badge bg-primary me-1">S</span> <span class="platform-name" data-platform-brand></span> <span id="lessonTitle">جاري التحميل...</span></span>
  </nav>

  <div class="container py-4">
    <div class="btn-group mb-3 w-100" role="group">
      <button class="btn btn-outline-primary" id="catExplanation" onclick="switchCategory('explanation')">📖 الشرح</button>
      <button class="btn btn-outline-primary" id="catQuestions" onclick="switchCategory('questions')" style="display: none;">❓ الأسئلة</button>
      <button class="btn btn-outline-primary" id="catHomework" onclick="switchCategory('homework_solution')">✅ حل الواجب</button>
    </div>

    <div id="noPartsMsg" class="alert alert-secondary" style="display:none;">لا يوجد فيديو من هذا النوع لهذا الدرس</div>

    <div class="card shadow-sm">
      <div class="card-body">
        <div id="playerContainer"></div>
        <div class="d-flex justify-content-between align-items-center mt-3">
          <button class="btn btn-outline-secondary" id="prevPartBtn" onclick="changePart(-1)">⬅ السابق</button>
          <span class="text-muted" id="partIndicator"></span>
          <button class="btn btn-outline-secondary" id="nextPartBtn" onclick="changePart(1)">التالي ➡</button>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="shared.js?v=2"></script>
  <script src="ad-render.js"></script>
  <script src="ads-popup.js"></script>
  <script src="video-broadcasts.js"></script>
  <script src="video-embed.js?v=1"></script>
  <script src="popup-question.js?v=1"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('videoId');
    if (!videoId) window.location.href = 'lessons.html';

    let currentParts = {};
    let questionsDisplayMode = 'inside';
    let currentCategory = 'explanation';
    let currentIndex = 0;
    let ytPlayer = null;
    let ytInterval = null;
    let iframeWatchInterval = null;
    let iframeWatchLastSent = 0;
    let iframeWatchPartId = null;
    let iframeWatchStart = 0;
    let iframeWatchBase = 0;

    const translations = {
      ar: { pageTitle: 'مشاهدة الدرس', btnBack: '⬅ رجوع للدروس', catExplanation: '📖 الشرح', catQuestions: '❓ الأسئلة', catHomework: '✅ حل الواجب', noPartsMsg: 'لا يوجد فيديو من هذا النوع لهذا الدرس', prevPart: '⬅ السابق', nextPart: 'التالي ➡', driveWarning: '⚠️ لا يمكن تتبع وقت المشاهدة لفيديوهات Google Drive بدقة', formatError: "<div class='alert alert-warning'>صيغة الرابط غير مدعومة</div>", loading: 'جاري التحميل...', alertError: 'لا يمكن فتح هذا الدرس', iframePlaybackNote: 'إذا لم يبدأ الفيديو تلقائياً، اضغط تشغيل داخل الإطار وفك كتم الصوت إذا كان مطلوباً.' },
      en: { pageTitle: 'Watch Lesson', btnBack: '⬅ Back to Lessons', catExplanation: '📖 Explanation', catQuestions: '❓ Questions', catHomework: '✅ HW Solution', noPartsMsg: 'There is no video of this type for this lesson', prevPart: '⬅ Previous', nextPart: 'Next ➡', driveWarning: '⚠️ Watch time cannot be tracked accurately for Google Drive videos', formatError: "<div class='alert alert-warning'>Unsupported video link format</div>", loading: 'Loading...', alertError: 'Cannot open this lesson', iframePlaybackNote: 'If the video does not start automatically, click play inside the frame and unmute it if needed.' }
    };

    function normalizeCategory(category) {
      if (category === 'questions') return 'questions';
      if (category === 'homework' || category === 'homework_solution') return 'homework_solution';
      return 'explanation';
    }

    function getCategoryParts(category) {
      const normalized = normalizeCategory(category);
      return Array.isArray(currentParts[normalized]) ? currentParts[normalized] : [];
    }

    function resolveCategory(category) {
      const questionsEligible = questionsDisplayMode !== 'outside';
      const categories = ['explanation', 'questions', 'homework_solution'].filter(cat => cat !== 'questions' || questionsEligible);
      if (category && categories.includes(normalizeCategory(category)) && getCategoryParts(category).length > 0) return normalizeCategory(category);
      return categories.find(cat => getCategoryParts(cat).length > 0) || 'explanation';
    }

    function applyLanguage(lang) {
      const isEn = lang === 'en';
      document.documentElement.lang = lang;
      document.documentElement.dir = isEn ? 'ltr' : 'rtl';
      const bootstrapLink = document.getElementById('bootstrap-link');
      bootstrapLink.href = isEn ? 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' : 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css';
      document.title = translations[lang].pageTitle;
      document.getElementById('btn-back').innerText = translations[lang].btnBack;
      document.getElementById('catExplanation').innerText = translations[lang].catExplanation;
      document.getElementById('catQuestions').innerText = translations[lang].catQuestions;
      document.getElementById('catHomework').innerText = translations[lang].catHomework;
      document.getElementById('noPartsMsg').innerText = translations[lang].noPartsMsg;
      document.getElementById('prevPartBtn').innerText = translations[lang].prevPart;
      document.getElementById('nextPartBtn').innerText = translations[lang].nextPart;
      if (document.getElementById('lessonTitle').textContent === 'جاري التحميل...' || document.getElementById('lessonTitle').textContent === 'Loading...') {
        document.getElementById('lessonTitle').textContent = translations[lang].loading;
      }
      document.getElementById('lang-toggle-btn').innerText = isEn ? 'العربية' : 'English';
      if (Object.keys(currentParts).length > 0) renderCurrentPart();
    }

    function toggleLanguage() {
      const currentLang = localStorage.getItem('portal_lang') || 'ar';
      const newLang = currentLang === 'ar' ? 'en' : 'ar';
      localStorage.setItem('portal_lang', newLang);
      applyLanguage(newLang);
    }

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.body.classList.add('dark-theme');
        document.getElementById('theme-toggle-btn').innerText = '☀️';
      } else {
        document.body.classList.remove('dark-theme');
        document.getElementById('theme-toggle-btn').innerText = '🌙';
      }
    }

    function toggleTheme() {
      const currentTheme = localStorage.getItem('portal_theme') || 'light';
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      localStorage.setItem('portal_theme', newTheme);
      applyTheme(newTheme);
    }

    // ===== الأسئلة المنبثقة =====
    let popupQuestions = [];
    let partPopups = [];
    let popupActive = false;
    let popupPollInterval = null;
    let popupControls = { pause() {}, resume() {} };
    let playerMsgHandler = null;
    let gotPlayerEvents = false; // لو الـ iframe (Vimeo/Bunny) بعت أحداث حقيقية بنعتمد عليها بدل الوقت التقديري

    // Vimeo (native API) و Bunny mediadelivery (player.js): بنسمع لـ timeupdate/ended عشان نعرف لو الطالب قدّم للآخر
    function listenToEmbeddedPlayer(iframe) {
      const post = (payload) => { try { iframe.contentWindow.postMessage(JSON.stringify(payload), '*'); } catch (_) {} };
      const subscribe = () => {
        ['timeupdate', 'ended'].forEach(ev => post({ context: 'player.js', version: '0.0.10', method: 'addEventListener', value: ev }));
        ['playProgress', 'finish'].forEach(ev => post({ method: 'addEventListener', value: ev }));
      };
      let lastSeconds = 0;
      playerMsgHandler = (e) => {
        if (e.source !== iframe.contentWindow) return;
        let d = e.data;
        if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
        if (!d || typeof d !== 'object') return;
        if (d.event === 'ready') { subscribe(); return; }
        const info = d.event === 'timeupdate' ? d.value : d.event === 'playProgress' ? d.data : null;
        if (info && typeof info.seconds === 'number') {
          gotPlayerEvents = true;
          lastSeconds = info.seconds;
          firePopups('time', info.seconds);
          if (info.duration && info.seconds >= info.duration - 0.5) firePopups('end', info.seconds);
        } else if (d.event === 'ended' || d.event === 'finish') {
          gotPlayerEvents = true;
          firePopups('end', lastSeconds);
        }
      };
      window.addEventListener('message', playerMsgHandler);
      iframe.addEventListener('load', subscribe);
    }

    async function loadPopupQuestions() {
      try {
        const res = await apiGet(`/api/portal/student/lessons/${videoId}/popups`);
        popupQuestions = res && res.success && Array.isArray(res.questions) ? res.questions : [];
      } catch (_) { popupQuestions = []; }
    }

    async function submitPopupEssay(questionId, file) {
      const form = new FormData();
      form.append('image', file);
      const res = await fetch(`${API_BASE_URL}/api/portal/student/popup-questions/${questionId}/essay`, {
        method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: form,
      });
      return res.json();
    }

    // kind: 'time' (مع الموضع الحالي بالثواني) أو 'end' (الفيديو خلص). الأسئلة بتظهر واحد ورا التاني.
    function firePopups(kind, position) {
      if (popupActive) return;
      const q = partPopups.find(p => !p.answered && !p.shown && (
        kind === 'end' || (p.triggerType === 'time' && position >= p.triggerSeconds)
      ));
      if (!q) return;
      q.shown = true;
      popupActive = true;
      popupControls.pause();
      const lang = localStorage.getItem('portal_lang') || 'ar';
      const handle = (res) => {
        if (!res || !res.success) throw new Error((res && res.message) || 'failed');
        q.answered = true;
        return res.result;
      };
      PopupQuestionUI.mount(q, {
        lang,
        onChoice: async (choice) => handle(await apiPost(`/api/portal/student/popup-questions/${q.id}/answer`, { choice })),
        onEssay: async (file) => handle(await submitPopupEssay(q.id, file)),
        onClosed: () => {
          popupActive = false;
          q.answered = true;
          if (kind === 'time') popupControls.resume();
          firePopups(kind, position);
        },
      });
    }

    function stopPopupPoll() {
      if (popupPollInterval) { clearInterval(popupPollInterval); popupPollInterval = null; }
    }

    // للمشغلات اللي مفيهاش events (iframe): بنقدّر الموضع من الوقت الفعلي
    function startPopupPoll(getPosition, durationSeconds, detectEnd) {
      stopPopupPoll();
      if (partPopups.length === 0) return;
      popupPollInterval = setInterval(() => {
        if (popupActive) return;
        const pos = getPosition();
        firePopups('time', pos);
        if (detectEnd && !gotPlayerEvents && durationSeconds > 0 && pos >= durationSeconds) firePopups('end', pos);
      }, 1000);
    }

    function clearPlayer() {
      stopPopupPoll();
      if (playerMsgHandler) { window.removeEventListener('message', playerMsgHandler); playerMsgHandler = null; }
      gotPlayerEvents = false;
      popupControls = { pause() {}, resume() {} };
      if (ytInterval) { clearInterval(ytInterval); ytInterval = null; }
      if (ytPlayer) { try { ytPlayer.destroy(); } catch (e) {} ytPlayer = null; }
      if (iframeWatchInterval) {
        clearInterval(iframeWatchInterval);
        iframeWatchInterval = null;
        if (iframeWatchPartId && iframeWatchLastSent > 0) {
          sendProgress(iframeWatchPartId, iframeWatchLastSent);
        }
        iframeWatchPartId = null;
      }
      document.getElementById('playerContainer').innerHTML = '';
    }

    // detectVideoSource / normalizeVimeoUrl / normalizeMediaDeliveryUrl now live in video-embed.js

    const progressRequests = new Map();

    function sendProgress(partId, seconds) {
      const nextSeconds = Math.floor(Number(seconds));
      if (!Number.isFinite(nextSeconds) || nextSeconds < 0) return;

      const current = progressRequests.get(partId);
      if (current) {
        current.latestSeconds = Math.max(current.latestSeconds, nextSeconds);
        return;
      }

      const request = { latestSeconds: nextSeconds };
      progressRequests.set(partId, request);
      apiPost('/api/portal/watch-progress', {
        video_part_id: partId,
        watched_seconds: nextSeconds,
      }).catch(() => {}).finally(() => {
        progressRequests.delete(partId);
        if (request.latestSeconds > nextSeconds) {
          sendProgress(partId, request.latestSeconds);
        }
      });
    }

    function flushIframeProgress() {
      if (iframeWatchPartId && iframeWatchLastSent > 0) {
        sendProgress(iframeWatchPartId, iframeWatchLastSent);
      }
    }

    window.addEventListener('beforeunload', () => {
      flushIframeProgress();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) flushIframeProgress();
    });

    function loadYouTubeAPI(callback) {
      if (window.YT && window.YT.Player) { callback(); return; }
      window.onYouTubeIframeAPIReady = callback;
      if (!document.getElementById('youtubeAPIScript')) {
        const tag = document.createElement('script');
        tag.id = 'youtubeAPIScript';
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);
      }
    }

    async function loadLesson() {
      const currentLang = localStorage.getItem('portal_lang') || 'ar';
      const result = await apiGet(`/api/portal/student/lessons/${videoId}/parts`);
      if (!result.success) {
        try {
          const cache = JSON.parse(sessionStorage.getItem('portal_video_access_cache') || '{}');
          delete cache[String(videoId)];
          sessionStorage.setItem('portal_video_access_cache', JSON.stringify(cache));
        } catch (_) {}
        alert(result.message || translations[currentLang].alertError);
        window.location.href = 'lessons.html';
        return;
      }
      const normalizedParts = { explanation: [], questions: [], homework_solution: [] };
      const incomingParts = result.parts || {};

      function pickArray(...keys) {
        for (const k of keys) {
          if (Array.isArray(incomingParts[k])) return incomingParts[k];
        }
        return [];
      }

      // Accept a few common alternative keys the API might return
      normalizedParts.explanation = pickArray('explanation', 'explanations', 'explanation_parts');
      normalizedParts.questions = pickArray('questions', 'question', 'qna', 'questions_parts');
      normalizedParts.homework_solution = pickArray('homework_solution', 'homework', 'homework_solutions', 'homeworks', 'homework_parts');

      currentParts = normalizedParts;
      console.debug('Loaded lesson parts counts:', {
        explanation: currentParts.explanation.length,
        questions: currentParts.questions.length,
        homework_solution: currentParts.homework_solution.length,
      });
      document.getElementById('lessonTitle').textContent = result.title || 'Lesson';

      questionsDisplayMode = result.questionsDisplay || 'inside';
      const showQuestionsTab = currentParts.questions.length > 0 && questionsDisplayMode !== 'outside';
      document.getElementById('catQuestions').style.display = showQuestionsTab ? 'inline-block' : 'none';

      await loadPopupQuestions();
      switchCategory('explanation');
    }

    function switchCategory(category) {
      currentCategory = resolveCategory(category);
      currentIndex = 0;
      ['catExplanation', 'catQuestions', 'catHomework'].forEach(id => document.getElementById(id).classList.remove('active'));
      const btnId = currentCategory === 'explanation' ? 'catExplanation' : currentCategory === 'questions' ? 'catQuestions' : 'catHomework';
      document.getElementById(btnId).classList.add('active');
      renderCurrentPart();
    }

    function changePart(direction) {
      const parts = getCategoryParts(currentCategory);
      const newIndex = currentIndex + direction;
      if (newIndex >= 0 && newIndex < parts.length) {
        currentIndex = newIndex;
        renderCurrentPart();
      }
    }

    function renderCurrentPart() {
      const currentLang = localStorage.getItem('portal_lang') || 'ar';
      const parts = getCategoryParts(currentCategory);
      const noPartsMsg = document.getElementById('noPartsMsg');
      const container = document.getElementById('playerContainer');
      clearPlayer();

      if (parts.length === 0) {
        container.style.display = 'none';
        noPartsMsg.style.display = 'block';
        document.getElementById('partIndicator').textContent = '';
        document.getElementById('prevPartBtn').style.display = 'none';
        document.getElementById('nextPartBtn').style.display = 'none';
        return;
      }

      container.style.display = 'block';
      noPartsMsg.style.display = 'none';
      const part = parts[currentIndex] || parts[0];
      currentIndex = parts.indexOf(part);
      iframeWatchLastSent = 0;
      iframeWatchPartId = null;
      iframeWatchStart = 0;
      iframeWatchBase = 0;
      partPopups = popupQuestions.filter(p => p.videoPartId === part.id && !p.answered);
      partPopups.forEach(p => { p.shown = false; });
      document.getElementById('partIndicator').textContent = parts.length > 1 ? `${currentIndex + 1} / ${parts.length}` : '';
      document.getElementById('prevPartBtn').style.display = parts.length > 1 ? 'inline-block' : 'none';
      document.getElementById('nextPartBtn').style.display = parts.length > 1 ? 'inline-block' : 'none';

      const rawUrl = part.sourceType === 'upload' ? `${API_BASE_URL}${part.filePath}` : (part.videoUrl || part.filePath || '');
      const source = part.sourceType === 'upload' ? { type: 'direct', url: rawUrl } : detectVideoSource(rawUrl);
      const playerFrame = document.createElement('div');
      playerFrame.className = 'player-frame';
      container.appendChild(playerFrame);

      if (source.type === 'direct') {
        const video = document.createElement('video');
        video.className = 'w-100';
        video.controls = true;
        video.style.maxHeight = '600px';
        video.src = source.url;
        playerFrame.appendChild(video);
        video.currentTime = part.watchedSeconds || 0;
        let lastSent = 0;
        popupControls = { pause: () => video.pause(), resume: () => { video.play().catch(() => {}); } };
        video.ontimeupdate = () => {
          const current = Math.floor(video.currentTime);
          if (current - lastSent >= 5) { lastSent = current; sendProgress(part.id, current); }
          firePopups('time', video.currentTime);
        };
        video.onended = () => firePopups('end', video.currentTime);
        video.onpause = () => sendProgress(part.id, Math.floor(video.currentTime));
      } else if (source.type === 'youtube') {
        const div = document.createElement('div');
        div.id = 'ytPlayerDiv';
        playerFrame.appendChild(div);
        loadYouTubeAPI(() => {
          ytPlayer = new YT.Player('ytPlayerDiv', {
            height: '600', width: '100%', videoId: source.id,
            events: {
              onReady: (e) => {
                if (part.watchedSeconds) e.target.seekTo(part.watchedSeconds, true);
                popupControls = { pause: () => { try { ytPlayer.pauseVideo(); } catch (_) {} }, resume: () => { try { ytPlayer.playVideo(); } catch (_) {} } };
                startPopupPoll(() => { try { return ytPlayer.getCurrentTime(); } catch (_) { return 0; } }, 0, false);
              },
              onStateChange: (e) => {
                if (e.data === YT.PlayerState.ENDED) firePopups('end', 0);
                if (e.data === YT.PlayerState.PLAYING) {
                  if (ytInterval) clearInterval(ytInterval);
                  ytInterval = setInterval(() => sendProgress(part.id, Math.floor(ytPlayer.getCurrentTime())), 5000);
                } else {
                  if (ytInterval) { clearInterval(ytInterval); ytInterval = null; }
                  if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
                    sendProgress(part.id, Math.floor(ytPlayer.getCurrentTime()));
                  }
                }
              }
            }
          });
        });
      } else if (source.type === 'drive') {
        const iframe = document.createElement('iframe');
        iframe.src = `https://drive.google.com/file/d/${source.id}/preview`;
        iframe.width = '100%'; iframe.height = '600'; iframe.allow = 'autoplay'; iframe.style.border = 'none';
        playerFrame.appendChild(iframe);
        const note = document.createElement('p');
        note.className = 'text-muted small mt-1'; note.textContent = translations[currentLang].driveWarning; container.appendChild(note);
      } else if (source.type === 'vimeo' || source.type === 'mediadelivery' || source.type === 'iframe') {
        const iframe = document.createElement('iframe');
        iframe.src = source.url;
        iframe.width = '100%'; iframe.height = '600';
        iframe.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write';
        iframe.style.border = 'none';
        iframe.setAttribute('referrerpolicy', 'origin');
        iframe.setAttribute('allowfullscreen', 'true');
        iframe.setAttribute('webkitallowfullscreen', 'true');
        iframe.setAttribute('mozallowfullscreen', 'true');
        iframe.title = 'Video player';
        if (source.type === 'vimeo' || source.type === 'mediadelivery') listenToEmbeddedPlayer(iframe);
        playerFrame.appendChild(iframe);

        iframeWatchPartId = part.id;
        iframeWatchBase = part.watchedSeconds || 0;
        iframeWatchLastSent = iframeWatchBase;
        iframeWatchStart = Date.now();

        const updateIframeProgress = () => {
          const elapsed = Math.floor((Date.now() - iframeWatchStart) / 1000);
          const total = part.durationSeconds
            ? Math.min(part.durationSeconds, iframeWatchBase + elapsed)
            : iframeWatchBase + elapsed;
          if (total > iframeWatchLastSent) {
            iframeWatchLastSent = total;
            sendProgress(part.id, total);
          }
        };

        if (iframeWatchBase > 0) {
          sendProgress(part.id, iframeWatchBase);
        }
        updateIframeProgress();
        iframeWatchInterval = setInterval(updateIframeProgress, 5000);
        // مفيش events من الـ iframe: الوقت بيتقدّر من وقت المشاهدة الفعلي (تقريبي)
        startPopupPoll(() => iframeWatchBase + Math.floor((Date.now() - iframeWatchStart) / 1000), part.durationSeconds || 0, true);

        const note = document.createElement('p');
        note.className = 'text-muted small mt-2';
        note.textContent = translations[currentLang].iframePlaybackNote || 'If the player does not start automatically, click the play button inside the video frame.';
        container.appendChild(note);
      } else {
        container.innerHTML = translations[currentLang].formatError;
      }
    }

    (function init() {
      const savedLang = localStorage.getItem('portal_lang') || 'ar';
      applyLanguage(savedLang);
      const savedTheme = localStorage.getItem('portal_theme') || 'light';
      applyTheme(savedTheme);
      loadLesson();
    })();
  </script>
</body>
</html>
