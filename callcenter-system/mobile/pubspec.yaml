name: callcenter_app
description: "Shady Elsharkawy call center (Android)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  ota_update: ^7.1.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#081E3E"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  min_sdk_android: 21
