# Deploys the student portal (public/) to Hostinger (shadyelsharkawy.com) through
# the Hostinger API. See scripts/deploy-portal.js: it uploads only files whose live
# copy differs from git, never deletes anything, and checks the live site afterwards.
#
# Needed GitHub secret (Settings -> Secrets and variables -> Actions):
#   HOSTINGER_API_TOKEN   token from hPanel -> Profile -> API

name: Deploy portal to Hostinger

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only list what would be uploaded, change nothing"
        type: boolean
        default: true

concurrency:
  group: deploy-portal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upload changed portal files
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: node scripts/deploy-portal.js ${{ !inputs.dry_run && '--upload' || '' }}
